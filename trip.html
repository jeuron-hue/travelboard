<!--
  SOURCE OF RECORD: trip.html, travelboard phone app (jeuron-hue/travelboard).

  What it does
  - Installed PWA for the Pixel. The UI reads IndexedDB only; Supabase is a sync
    target, never a render source (SPEC.md D8, 6.5, 6.6).
  - M0 Foundation: app shell, IndexedDB (captures, drafts, meta), sync engine
    (push dirty rows to tb_captures_upsert, pull by keyset cursor from
    tb_captures_since), sign in with the synthetic login, sync status dot,
    "update ready" bar, storage persistence, theme toggle.
  - M1 Capture (SPEC.md 7): home lists one local day of captures (day rolls over
    at 0400 in the capture's zone) with a date switcher; full-screen capture and
    edit screen with drafts saved on every input; GPS after save, never awaited;
    soft delete with a 5 s Undo; home-screen shortcut (?new=1) and share target
    prefill; JSON export of every capture.
  - M2 Journal (SPEC.md 8): Journal tab with one thread per local day and a day list;
    the same full-screen textarea as capture for writing; a turn is stored locally as
    pending and sent to the tb-journal Edge Function by the sync engine, so it queues
    offline and sends on reconnect; Claude's reply is stored once per turn; journal-kind
    captures show inline in the day's thread; optional title suffix per day.

  Change log (newest first)
  - 10/10/26 v4. M2 Journal. Captures and Journal tabs in the header. IndexedDB version 2
    adds stores journal and jdays. Sync order: push captures, push day suffixes, send
    queued journal turns oldest first (stops at the first failure, which shows Retry),
    pull captures, pull journal days whose message count or latest server_ts changed.
    The status pill counts queued journal turns with queued captures.
  - 04/10/26 v3. M1 Capture. Capture and edit screen, drafts, 0400 local-day rule, date
    switcher, row layout (time in the row's zone with a city suffix, kind chip, GPS dot,
    sync chip), GPS merge, soft delete with Undo, ?new=1 and share target, Export.
    updated_at strictly increases on every local change. Removed the M0 "Add test record"
    button and hint. [hidden] now always hides: a display rule was overriding it (the
    sign-in form showed while signed in).
  - 04/10/26 v2. Status pill fix from the Pixel test: starts as "checking" (or "offline" when
    navigator.onLine is false) instead of "synced"; a 5 s reachability probe runs before each
    sync, because navigator.onLine stayed true in airplane mode with a VPN active; a 30 s
    retry runs while visible with rows queued or the pill offline.
  - 04/10/26 v1. M0 Foundation first build.
-->

// Bump together with CACHE_VERSION in sw.js on every release.

const SUPABASE_URL = 'https://nyjsrnntxdgfykkmihpx.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_q75DGiJBda-NwE3tdgPtFg_g3Rasmcg';
const PUSH_BATCH = 50;
const FETCH_TIMEOUT_MS = 20000;
const PROBE_TIMEOUT_MS = 5000;
const RETRY_MS = 30000;
const DAY_ROLLOVER_HOUR = 4;        // the local day ends at 0400 (SPEC.md principle 8)
const BODY_MAX = 20000;             // server check: char_length(body) <= 20000
const UNDO_MS = 5000;
const GPS_OPTS = { enableHighAccuracy: true, timeout: 5000, maximumAge: 60000 };
const JOURNAL_URL = SUPABASE_URL + '/functions/v1/tb-journal';
const JOURNAL_TIMEOUT_MS = 120000;  // tb-journal gives Claude 90 s; a retry after a timeout is free
const JOURNAL_DAYS_LIMIT = 400;

const $ = (id) => document.getElementById(id);

// ---------- dates: dd/mm/yy, 24-hour "0901 hrs", local day in the record's zone ----------

function partsIn(date, tz) {
  const fmt = new Intl.DateTimeFormat('en-GB', {
    timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
  });
  const p = {};
  for (const x of fmt.formatToParts(date)) p[x.type] = x.value;
  return p;
}
function localDateIn(date, tz) {              // 'YYYY-MM-DD', calendar date in tz
  const p = partsIn(date, tz);
  return `${p.year}-${p.month}-${p.day}`;
}
// Local day: the calendar date in tz, minus one day when the local time there is before
// 0400. 0030 hrs in Bangkok belongs to that Bangkok evening. Used for local_date at
// capture and for "today" on the home screen (SPEC.md principle 8, 6.2, 7.2).
function localDay(date, tz) {
  const p = partsIn(date, tz);
  if (Number(p.hour) >= DAY_ROLLOVER_HOUR) return `${p.year}-${p.month}-${p.day}`;
  return addDays(`${p.year}-${p.month}-${p.day}`, -1);
}
function addDays(ymd, n) {
  const [y, m, d] = ymd.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
}
const todayLocal = () => localDay(new Date(), deviceTz());
function fmtDayLabel(ymd) {                   // 'Sun 04/10/26'
  const [y, m, d] = ymd.split('-').map(Number);
  const wd = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
  return `${wd} ${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}/${String(y).slice(2)}`;
}
// 'Asia/Bangkok' -> 'Bangkok', 'America/Argentina/Buenos_Aires' -> 'Buenos Aires'
const cityOf = (tz) => String(tz || '').split('/').pop().replace(/_/g, ' ');
// updated_at must strictly increase on every local change, even within one millisecond
// or after the device clock moves back: the server applies only a strictly newer one.
function nextUpdatedAt(prev) {
  const p = prev ? Date.parse(prev) : NaN;
  return new Date(Math.max(Date.now(), Number.isFinite(p) ? p + 1 : 0)).toISOString();
}
function fmtDate(iso, tz) {
  const p = partsIn(new Date(iso), tz);
  return `${p.day}/${p.month}/${p.year.slice(2)}`;
}
function fmtTime(iso, tz) {
  const p = partsIn(new Date(iso), tz);
  return `${p.hour}${p.minute} hrs`;
}
const deviceTz = () => Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';

// ---------- IndexedDB: database travelboard v2, small promise wrapper ----------
// v1 (M0): captures, drafts, meta. v2 (M2): journal (turns and replies, by id) and jdays
// (one row per local day: title suffix, and the server's message count and latest
// server_ts from the last pull, used to skip unchanged days).

const idb = (() => {
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((resolve, reject) => {
      const r = indexedDB.open('travelboard', 2);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains('captures')) {
          const s = db.createObjectStore('captures', { keyPath: 'id' });
          s.createIndex('local_date', 'local_date');
          s.createIndex('dirty', 'dirty');
        }
        if (!db.objectStoreNames.contains('drafts')) db.createObjectStore('drafts', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });
        if (!db.objectStoreNames.contains('journal')) {
          const j = db.createObjectStore('journal', { keyPath: 'id' });
          j.createIndex('local_date', 'local_date');
          j.createIndex('state', 'state');
        }
        if (!db.objectStoreNames.contains('jdays')) db.createObjectStore('jdays', { keyPath: 'local_date' });
      };
      r.onsuccess = () => {
        const db = r.result;
        // A newer version opening elsewhere (an update in another tab) must not be blocked by us.
        db.onversionchange = () => db.close();
        resolve(db);
      };
      r.onerror = () => reject(r.error);
      // An older copy open in another tab holds the upgrade until it closes; the open then
      // completes by itself, so wait rather than fail.
      r.onblocked = () => console.warn('IndexedDB upgrade waiting for another travelboard tab to close');
    });
    return dbp;
  }
  const done = (t) => new Promise((resolve, reject) => {
    t.oncomplete = () => resolve();
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error || new Error('transaction aborted'));
  });
  const result = (r) => new Promise((resolve, reject) => {
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
  return {
    open,
    async get(store, key) {
      const db = await open();
      return result(db.transaction(store).objectStore(store).get(key));
    },
    async put(store, value) {
      const db = await open();
      const t = db.transaction(store, 'readwrite');
      t.objectStore(store).put(value);
      return done(t);
    },
    async del(store, key) {
      const db = await open();
      const t = db.transaction(store, 'readwrite');
      t.objectStore(store).delete(key);
      return done(t);
    },
    // One readwrite transaction over several stores; fn(t) queues its requests
    // synchronously. Used to write a capture and clear its draft atomically.
    async tx(stores, fn) {
      const db = await open();
      const t = db.transaction(stores, 'readwrite');
      fn(t);
      return done(t);
    },
    // Read-modify-write one row. fn(existing) returns the row to put, or null to leave it.
    // Resolves to the row written, or null.
    async update(store, key, fn) {
      const db = await open();
      const t = db.transaction(store, 'readwrite');
      const s = t.objectStore(store);
      let out = null;
      const g = s.get(key);
      g.onsuccess = () => {
        const next = fn(g.result);
        if (next) { s.put(next); out = next; }
      };
      await done(t);
      return out;
    },
    async all(store) {
      const db = await open();
      return result(db.transaction(store).objectStore(store).getAll());
    },
    async byIndex(store, index, value) {
      const db = await open();
      return result(db.transaction(store).objectStore(store).index(index).getAll(value));
    },
    async countByIndex(store, index, value) {
      const db = await open();
      return result(db.transaction(store).objectStore(store).index(index).count(value));
    },
    // Read-modify-write many rows in one transaction. fn(existing, item) returns the row
    // to put, or null to leave it alone.
    async merge(store, items, keyOf, fn) {
      const db = await open();
      const t = db.transaction(store, 'readwrite');
      const s = t.objectStore(store);
      for (const item of items) {
        const g = s.get(keyOf(item));
        g.onsuccess = () => {
          const next = fn(g.result, item);
          if (next) s.put(next);
        };
      }
      return done(t);
    }
  };
})();

const meta = {
  async get(key) { const r = await idb.get('meta', key); return r ? r.value : undefined; },
  set(key, value) { return idb.put('meta', { key, value }); }
};

// ---------- Supabase client: sync target only ----------

function fetchWithTimeout(input, init) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), FETCH_TIMEOUT_MS);
  if (init && init.signal) init.signal.addEventListener('abort', () => ctl.abort());
  return fetch(input, Object.assign({}, init, { signal: ctl.signal }))
    .finally(() => clearTimeout(timer));
}

let sb = null;
try {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: 'tb-auth' },
    global: { fetch: fetchWithTimeout }
  });
} catch (e) {
  // The app still works from IndexedDB without the client; sync just stays paused.
  console.error('supabase client failed to load', e);
}

// ---------- captures ----------

const SERVER_FIELDS = ['id', 'body', 'kind', 'captured_at', 'tz', 'local_date', 'lat', 'lng',
  'accuracy_m', 'trip_id', 'place_id', 'updated_at', 'deleted_at'];
const toServer = (row) => Object.fromEntries(SERVER_FIELDS.map((k) => [k, row[k] === undefined ? null : row[k]]));

// ---------- capture rows: save, edit, delete, GPS ----------

function newCaptureRow(body, kind) {
  const now = new Date();
  const iso = now.toISOString();
  const tz = deviceTz();
  return {
    id: crypto.randomUUID(),
    body,
    kind,
    captured_at: iso,
    tz,
    local_date: localDay(now, tz),
    lat: null, lng: null, accuracy_m: null,
    trip_id: null, place_id: null,
    updated_at: iso,
    deleted_at: null,
    server_ts: null,
    dirty: 1
  };
}

// GPS for a new capture: fired after the row is saved, never awaited. The fix is applied
// with a read-modify-write, so an edit or a push confirmation in between is never lost.
// Failure or denial leaves the nulls in place, silently.
function requestGps(id) {
  if (!navigator.geolocation) return;
  try {
    navigator.geolocation.getCurrentPosition((pos) => {
      const c = pos.coords;
      idb.update('captures', id, (row) => row && Object.assign({}, row, {
        lat: c.latitude,
        lng: c.longitude,
        accuracy_m: Number.isFinite(c.accuracy) ? c.accuracy : null,
        updated_at: nextUpdatedAt(row.updated_at),
        dirty: 1
      })).then((r) => { if (r) { render(); sync(); } })
        .catch((e) => console.warn('gps merge failed', e));
    }, () => { /* denied, unavailable or timed out: the capture keeps null coordinates */ }, GPS_OPTS);
  } catch (e) { /* no geolocation: same as denied */ }
}

// ---------- capture screen ----------

// mode 'new' (draft key "new"), 'edit' (draft key = capture id) or 'journal' (the same
// screen as the journal composer, draft key "journal:<local_date>", Save reads Send).
const cap = { open: false, mode: null, row: null, kind: 'note', busy: false, jdate: null };
const draftKey = () => (cap.mode === 'new' ? 'new' : cap.mode === 'journal' ? 'journal:' + cap.jdate : cap.row.id);
const capBody = () => $('cap-body').value.trim().slice(0, BODY_MAX);

function setKind(kind) {
  cap.kind = kind === 'journal' ? 'journal' : 'note';
  $('kind-note').setAttribute('aria-pressed', String(cap.kind === 'note'));
  $('kind-journal').setAttribute('aria-pressed', String(cap.kind === 'journal'));
}
function updateSaveEnabled() {
  $('cap-save').disabled = cap.busy || capBody() === '';
}

// Every input writes the draft with open: true. Open means the screen is up, so a draft
// still open at boot means the app was killed mid-typing.
function writeDraft() {
  if (!cap.open) return Promise.resolve();
  return idb.put('drafts', {
    id: draftKey(), body: $('cap-body').value, kind: cap.kind, open: true,
    updated_at: new Date().toISOString()
  }).catch((e) => console.warn('draft write failed', e));
}

// Android back: opening the screen pushes a history entry, so back pops it and closes the
// screen instead of leaving the app. Closing from a button pops the entry ourselves.
let popResolve = null, popWait = null;
function popCaptureState() {
  if (!(history.state && history.state.tbCap)) return;
  popWait = new Promise((resolve) => {
    popResolve = resolve;
    setTimeout(resolve, 600);   // never wait forever on a lost popstate
  }).then(() => { popResolve = null; popWait = null; });
  history.back();
}
window.addEventListener('popstate', () => {
  if (popResolve) { popResolve(); return; }
  if (cap.open) closeCapture('back');
});

async function openCapture(mode, row, draft) {
  if (popWait) await popWait;
  cap.mode = mode;
  cap.row = row || null;
  cap.busy = false;
  const ta = $('cap-body');
  ta.value = draft ? draft.body : row ? row.body : '';
  setKind(draft ? draft.kind : row ? row.kind : 'note');
  if (mode === 'edit') {
    const parts = [`Captured ${fmtDate(row.captured_at, row.tz)} ${fmtTime(row.captured_at, row.tz)}`];
    if (row.tz !== deviceTz()) parts.push(cityOf(row.tz));
    parts.push(row.lat != null ? `GPS ${Math.round(row.accuracy_m || 0)} m` : 'no GPS');
    $('cap-info').textContent = parts.join(', ');
  }
  $('cap-foot').hidden = mode !== 'edit';
  $('kind-group').hidden = mode === 'journal';
  $('cap-save').textContent = mode === 'journal' ? 'Send' : 'Save';
  ta.placeholder = mode === 'journal'
    ? 'Tell Claude about the day. Tap the mic on the keyboard to talk.'
    : 'Type, or tap the mic on the keyboard';
  $('cap').setAttribute('aria-label',
    mode === 'edit' ? 'Edit capture' : mode === 'journal' ? 'Journal, ' + jTitleText(cap.jdate) : 'New capture');
  $('cap').hidden = false;
  cap.open = true;
  history.pushState({ tbCap: true }, '');
  updateSaveEnabled();
  if (draft) writeDraft();            // re-mark an existing draft as open
  if (mode === 'new' || mode === 'journal') {
    // On a launch with no user gesture (home-screen shortcut) Android may not raise the
    // keyboard for this focus; checked on the device, not assumed.
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
  }
}

async function openNew() {
  const draft = await idb.get('drafts', 'new');
  await openCapture('new', null, draft);
}
async function openJournalComposer(date) {
  cap.jdate = date;
  const draft = await idb.get('drafts', 'journal:' + date);
  await openCapture('journal', null, draft);
}
async function openEdit(id) {
  const row = await idb.get('captures', id);
  if (!row || row.deleted_at) return;
  const draft = await idb.get('drafts', id);
  await openCapture('edit', row, draft);
}

// how: 'close' (button), 'back' (Android back), 'saved', 'deleted'.
async function closeCapture(how) {
  if (!cap.open) return;
  cap.open = false;
  const key = draftKey();
  const body = $('cap-body').value;
  const kind = cap.kind;
  $('cap-body').blur();
  $('cap').hidden = true;
  if (how !== 'back') popCaptureState();
  if (how === 'close' || how === 'back') {
    // New capture or journal turn: keep the draft, closed. Edit: discard it.
    if ((cap.mode === 'new' || cap.mode === 'journal') && body.trim()) {
      await idb.put('drafts', { id: key, body, kind, open: false, updated_at: new Date().toISOString() });
    } else {
      await idb.del('drafts', key);
    }
  }
  await updateDraftNote();
}

// The bottom button: Capture on the Captures tab, Write on the Journal tab (for the day on
// screen). "draft kept" shows while that button's closed draft exists.
async function updateDraftNote() {
  const journal = tab === 'journal';
  const label = journal ? 'Write' : 'Capture';
  const d = await idb.get('drafts', journal ? 'journal:' + jDay : 'new');
  const kept = !!(d && d.body && d.body.trim());
  $('primary-label').textContent = label;
  $('draft-note').hidden = !kept;
  $('capture').setAttribute('aria-label', kept ? label + ', draft kept' : label);
}

async function saveCapture() {
  if (cap.mode === 'journal') return sendTurn();
  const body = capBody();
  if (!cap.open || cap.busy || !body) return;
  cap.busy = true;
  updateSaveEnabled();
  try {
    if (cap.mode === 'new') {
      const row = newCaptureRow(body, cap.kind);
      // Local write first, atomically with clearing the draft. Never waits on GPS or network.
      await idb.tx(['captures', 'drafts'], (t) => {
        t.objectStore('captures').put(row);
        t.objectStore('drafts').delete('new');
      });
      followToday = true;
      await closeCapture('saved');
      await render();
      requestGps(row.id);
    } else {
      const id = cap.row.id, kind = cap.kind;
      // Body and kind only; captured_at, tz and local_date never change on edit.
      await idb.tx(['captures', 'drafts'], (t) => {
        const s = t.objectStore('captures');
        const g = s.get(id);
        g.onsuccess = () => {
          const row = g.result;
          if (!row || (row.body === body && row.kind === kind)) return;
          s.put(Object.assign({}, row, { body, kind, updated_at: nextUpdatedAt(row.updated_at), dirty: 1 }));
        };
        t.objectStore('drafts').delete(id);
      });
      await closeCapture('saved');
      await render();
    }
    sync();
  } catch (e) {
    cap.busy = false;
    updateSaveEnabled();
    alert('Save failed: ' + ((e && e.message) || e));
  }
}

async function deleteCapture() {
  if (!cap.open || cap.mode !== 'edit' || cap.busy) return;
  cap.busy = true;
  const id = cap.row.id;
  try {
    // Soft delete only: deleted_at set, row kept and synced so the delete propagates.
    await idb.tx(['captures', 'drafts'], (t) => {
      const s = t.objectStore('captures');
      const g = s.get(id);
      g.onsuccess = () => {
        const row = g.result;
        if (!row || row.deleted_at) return;
        const ts = nextUpdatedAt(row.updated_at);
        s.put(Object.assign({}, row, { deleted_at: ts, updated_at: ts, dirty: 1 }));
      };
      t.objectStore('drafts').delete(id);
    });
    await closeCapture('deleted');
    await render();
    showToast('Capture deleted', () => undoDelete(id));
    sync();
  } catch (e) {
    cap.busy = false;
    alert('Delete failed: ' + ((e && e.message) || e));
  }
}

async function undoDelete(id) {
  await idb.update('captures', id, (row) => row && row.deleted_at ? Object.assign({}, row, {
    deleted_at: null, updated_at: nextUpdatedAt(row.updated_at), dirty: 1
  }) : null);
  await render();
  sync();
}

let toastTimer = null;
function showToast(text, onUndo) {
  clearTimeout(toastTimer);
  $('toast-text').textContent = text;
  $('toast-undo').hidden = !onUndo;
  $('toast-undo').onclick = onUndo ? () => { hideToast(); onUndo(); } : null;
  $('toast').hidden = false;
  toastTimer = setTimeout(hideToast, UNDO_MS);
}
function hideToast() {
  clearTimeout(toastTimer);
  $('toast').hidden = true;
  $('toast-undo').onclick = null;
}

// ---------- entry routes: ?new=1 shortcut, share target, killed mid-typing ----------

// title, text and url joined into the body, dropping any part already contained in
// another (Maps often repeats the link inside text). Never parsed into fields.
function buildPrefill(title, text, url) {
  const parts = [title, text, url].map((s) => (s || '').trim()).filter(Boolean);
  return parts.filter((p, i) => !parts.some((q, j) => j !== i && q.includes(p) && (q.length > p.length || j < i)))
    .join('\n');
}

async function handleEntry() {
  const q = new URLSearchParams(location.search);
  const shared = q.has('title') || q.has('text') || q.has('url');
  if (q.get('new') === '1' || shared) {
    const prefill = buildPrefill(q.get('title'), q.get('text'), q.get('url'));
    if (prefill) {
      const old = await idb.get('drafts', 'new');
      let body = old && old.body ? old.body : '';
      if (!body.includes(prefill)) body = body.trim() ? body.replace(/\s+$/, '') + '\n' + prefill : prefill;
      await idb.put('drafts', {
        id: 'new', body: body.slice(0, BODY_MAX), kind: old ? old.kind : 'note', open: true,
        updated_at: new Date().toISOString()
      });
    }
    // Clean URL, so a reload or a later launch does not apply the same entry twice.
    history.replaceState(null, '', location.pathname);
    await openNew();
    return;
  }
  // Auto-reopen only a draft left open, i.e. the app was killed mid-typing.
  const open = (await idb.all('drafts')).filter((d) => d.open)
    .sort((a, b) => (a.updated_at < b.updated_at ? 1 : -1));
  for (const d of open) {
    if (d.id === 'new') { await openNew(); return; }
    if (d.id.startsWith('journal:')) {
      setTab('journal');
      jDay = d.id.slice(8); jView = 'thread'; jFollowToday = jDay === todayLocal();
      await openJournalComposer(jDay);
      return;
    }
    const row = await idb.get('captures', d.id);
    if (row && !row.deleted_at) { await openCapture('edit', row, d); return; }
    await idb.del('drafts', d.id);
  }
}

// ---------- export ----------

async function exportCaptures() {
  const rows = (await idb.all('captures')).sort((a, b) => (a.captured_at < b.captured_at ? -1 : 1));
  const captures = rows.map((r) => Object.assign(toServer(r), {
    deleted: !!r.deleted_at,
    synced: !r.dirty,
    server_ts: r.server_ts || null
  }));
  const now = new Date();
  const p = partsIn(now, deviceTz());
  const name = `travelboard-captures-${p.day}${p.month}${p.year.slice(2)}-${p.hour}${p.minute}.json`;
  const json = JSON.stringify({
    app: 'travelboard', app_version: APP_VERSION, exported_at: now.toISOString(),
    device_tz: deviceTz(), count: captures.length, captures
  }, null, 2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  showToast(`Exported ${captures.length} captures`, null);
}

// ---------- rendering: IndexedDB only ----------

// The home screen shows one local day. It follows "today" (0400 rollover, device zone)
// until the user steps to another day; tapping the date label returns to today.
let viewDay = null;
let followToday = true;

// Renders the tab on screen, then the status pill. IndexedDB only.
async function render() {
  if (tab === 'journal') await renderJournal(); else await renderCaptures();
  await renderStatus();
}

async function renderCaptures() {
  const live = (await idb.all('captures')).filter((r) => !r.deleted_at);
  const today = todayLocal();
  if (followToday || !viewDay) viewDay = today;
  if (viewDay === today) followToday = true;

  // Arrows step to the nearest day with captures; today is always reachable.
  const days = [...new Set(live.map((r) => r.local_date).concat([today]))].sort();
  const prev = days.filter((d) => d < viewDay).pop();
  const next = days.find((d) => d > viewDay);
  $('day-prev').disabled = !prev;
  $('day-next').disabled = !next;
  $('day-prev').dataset.day = prev || '';
  $('day-next').dataset.day = next || '';
  $('day-label').textContent = fmtDayLabel(viewDay);
  $('day-label').classList.toggle('today', viewDay === today);

  const here = deviceTz();
  const rows = live.filter((r) => r.local_date === viewDay)
    .sort((a, b) => (a.captured_at < b.captured_at ? 1 : a.captured_at > b.captured_at ? -1 : 0));
  const ul = $('records');
  ul.replaceChildren();
  for (const r of rows) {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'row';
    btn.dataset.id = r.id;

    const l1 = document.createElement('div');
    l1.className = 'line1';
    const when = document.createElement('span');
    when.className = 'when';
    when.textContent = fmtTime(r.captured_at, r.tz);
    if (r.tz !== here) {
      const city = document.createElement('span');
      city.className = 'city';
      city.textContent = ' ' + cityOf(r.tz);
      when.append(city);
    }
    const spacer = document.createElement('span');
    spacer.className = 'spacer';
    const kind = document.createElement('span');
    kind.className = 'chip ' + (r.kind === 'journal' ? 'journal' : 'note');
    kind.textContent = r.kind === 'journal' ? 'journal' : 'note';
    l1.append(when, spacer, kind);
    if (r.lat != null && r.lng != null) {
      const gps = document.createElement('span');
      gps.className = 'gps';
      gps.title = 'GPS fix recorded';
      gps.setAttribute('aria-label', 'GPS fix recorded');
      l1.append(gps);
    }
    const chip = document.createElement('span');
    chip.className = 'chip ' + (r.dirty ? 'queued' : 'synced');
    chip.textContent = r.dirty ? 'queued' : 'synced';
    l1.append(chip);

    const l2 = document.createElement('div');
    l2.className = 'line2';
    l2.textContent = (r.body || '').split('\n').find((s) => s.trim()) || '(empty)';

    btn.append(l1, l2);
    li.append(btn);
    ul.append(li);
  }
  $('empty').textContent = viewDay === today ? 'Nothing captured today yet.' : 'No captures on this day.';
  $('empty').hidden = rows.length > 0;
}

// ---------- journal (SPEC.md 8): one thread per local day ----------

let tab = 'captures';             // 'captures' | 'journal'
let jView = 'thread';             // 'thread' | 'days'
let jDay = null;                  // local day of the thread on screen
let jFollowToday = true;          // the thread follows "today" (0400 rollover) until another day is picked
let jScrollToEnd = true;
const jInflight = new Set();      // ids of turns being sent right now
const jSuffixes = new Map();      // local_date -> title suffix, refreshed on every journal render

function setTab(t) {
  tab = t === 'journal' ? 'journal' : 'captures';
  $('tab-captures').setAttribute('aria-pressed', String(tab === 'captures'));
  $('tab-journal').setAttribute('aria-pressed', String(tab === 'journal'));
  $('daybar').hidden = tab !== 'captures';
  $('captures-view').hidden = tab !== 'captures';
  $('jbar').hidden = tab !== 'journal';
  $('journal-view').hidden = tab !== 'journal';
}

// 'Sat 10/10/26 Bangkok day 1'
const jTitleText = (d) => fmtDayLabel(d) + (jSuffixes.get(d) ? ' ' + jSuffixes.get(d) : '');

// Thread order (SPEC.md 8.2): user turns by (created_at, id), each reply straight after the
// turn it answers. The server and tb-journal use the same order.
function threadOrder(msgs) {
  const byId = new Map(msgs.map((m) => [m.id, m]));
  const key = (m) => {
    const u = m.role === 'assistant' && byId.get(m.reply_to);
    return u ? [Date.parse(u.created_at), u.id, 1] : [Date.parse(m.created_at), m.id, 0];
  };
  return msgs.slice().sort((a, b) => {
    const x = key(a), y = key(b);
    if (x[0] !== y[0]) return x[0] - y[0];
    if (x[1] !== y[1]) return x[1] < y[1] ? -1 : 1;
    return x[2] - y[2];
  });
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

async function renderJournal() {
  const today = todayLocal();
  if (jFollowToday || !jDay) jDay = today;
  if (jDay === today) jFollowToday = true;
  jSuffixes.clear();
  for (const d of await idb.all('jdays')) if (d.suffix) jSuffixes.set(d.local_date, d.suffix);
  $('j-daylist').hidden = jView !== 'days';
  $('j-thread').hidden = jView !== 'thread';
  const here = deviceTz();

  if (jView === 'days') {
    // Every day with messages, captures or a title, plus today; newest first.
    $('j-days').textContent = 'Today';
    $('j-title').textContent = 'Journal days';
    $('j-title').classList.remove('today');
    const days = new Map();
    const add = (d) => { if (!days.has(d)) days.set(d, { m: 0, c: 0, q: 0 }); return days.get(d); };
    add(today);
    for (const m of await idb.all('journal')) { const x = add(m.local_date); x.m++; if (m.state === 'pending' || m.state === 'error') x.q++; }
    for (const c of await idb.all('captures')) if (!c.deleted_at) add(c.local_date).c++;
    for (const d of jSuffixes.keys()) add(d);
    const ul = $('j-daylist');
    ul.replaceChildren();
    for (const d of [...days.keys()].sort().reverse()) {
      const x = days.get(d);
      const li = el('li');
      const btn = el('button', 'row dayrow');
      btn.type = 'button';
      btn.dataset.day = d;
      const l1 = el('div', 'line1');
      const when = el('span', 'when' + (d === today ? ' today' : ''), jTitleText(d));
      l1.append(when, el('span', 'spacer'));
      if (x.q) l1.append(el('span', 'chip queued', `${x.q} not sent`));
      const parts = [x.m ? `${x.m} message${x.m === 1 ? '' : 's'}` : 'No messages yet',
        `${x.c} capture${x.c === 1 ? '' : 's'}`];
      btn.append(l1, el('div', 'line2', parts.join(', ')));
      li.append(btn);
      ul.append(li);
    }
    $('j-empty').hidden = true;
    return;
  }

  $('j-days').textContent = 'Days';
  $('j-title').textContent = jTitleText(jDay);
  $('j-title').classList.toggle('today', jDay === today);
  const msgs = threadOrder(await idb.byIndex('journal', 'local_date', jDay));
  const caps = (await idb.byIndex('captures', 'local_date', jDay)).filter((r) => !r.deleted_at);
  // Captures tagged journal show inline as quoted context, placed by time.
  const quotes = caps.filter((r) => r.kind === 'journal').sort((a, b) => (a.captured_at < b.captured_at ? -1 : 1));
  const items = [];
  let qi = 0;
  const byId = new Map(msgs.map((m) => [m.id, m]));
  for (const m of msgs) {
    const t = Date.parse(m.role === 'assistant' && byId.get(m.reply_to) ? byId.get(m.reply_to).created_at : m.created_at);
    while (qi < quotes.length && Date.parse(quotes[qi].captured_at) <= t && m.role === 'user') items.push(quotes[qi++]);
    items.push(m);
  }
  while (qi < quotes.length) items.push(quotes[qi++]);

  const ul = $('j-thread');
  ul.replaceChildren();
  for (const it of items) {
    if (it.role === undefined) {
      const li = el('li', 'quote');
      li.dataset.capture = it.id;
      li.append(el('span', 'meta', `journal capture, ${fmtTime(it.captured_at, it.tz)}${it.tz !== here ? ' ' + cityOf(it.tz) : ''}`),
        document.createTextNode(it.body || ''));
      ul.append(li);
      continue;
    }
    const li = el('li', 'msg ' + (it.role === 'assistant' ? 'assistant' : 'user'));
    li.dataset.id = it.id;
    li.append(el('div', 'text', it.content));
    const meta = el('div', 'meta');
    meta.append(el('span', null, fmtTime(it.created_at, here)));
    if (it.role === 'user') {
      if (jInflight.has(it.id)) meta.append(el('span', 'chip queued', 'sending'));
      else if (it.state === 'pending') meta.append(el('span', 'chip queued', 'queued'));
      else if (it.state === 'error') {
        meta.append(el('span', 'chip failed', 'not sent'), el('span', 'errtext', it.error || 'failed'));
        const b = el('button', 'retry', 'Retry');
        b.type = 'button';
        b.dataset.retry = it.id;
        meta.append(b);
      }
    }
    li.append(meta);
    ul.append(li);
    if (it.role === 'user' && jInflight.has(it.id)) ul.append(el('li', 'typing', 'Claude is replying'));
  }
  if (!items.length) {
    $('j-empty').textContent = 'No messages yet. Tap Write to tell Claude about the day. ' + (caps.length
      ? `It will see your ${caps.length} capture${caps.length === 1 ? '' : 's'} from this day.`
      : 'Nothing was captured on this day.');
  }
  $('j-empty').hidden = items.length > 0;
  if (jScrollToEnd) {
    jScrollToEnd = false;
    const main = document.querySelector('main');
    main.scrollTop = main.scrollHeight;
  }
}

// Send: the turn is written locally as pending, then the sync engine sends it (now if
// online, on reconnect if not). Never waits on the network.
async function sendTurn() {
  const content = capBody();
  if (!cap.open || cap.busy || !content) return;
  cap.busy = true;
  updateSaveEnabled();
  try {
    const date = cap.jdate;
    const row = {
      id: crypto.randomUUID(), local_date: date, role: 'user', content, reply_to: null,
      model: null, input_tokens: null, output_tokens: null,
      created_at: new Date().toISOString(), server_ts: null, state: 'pending', error: null
    };
    await idb.tx(['journal', 'drafts'], (t) => {
      t.objectStore('journal').put(row);
      t.objectStore('drafts').delete('journal:' + date);
    });
    jDay = date;
    jFollowToday = date === todayLocal();
    jView = 'thread';
    jScrollToEnd = true;
    await closeCapture('saved');
    await render();
    sync();
  } catch (e) {
    cap.busy = false;
    updateSaveEnabled();
    alert('Send failed: ' + ((e && e.message) || e));
  }
}

async function retryTurn(id) {
  await idb.update('journal', id, (r) => r && r.state === 'error' ? Object.assign({}, r, { state: 'pending', error: null }) : null);
  jScrollToEnd = true;
  await render();
  sync();
}

async function openJournalDay(d) {
  jDay = d;
  jFollowToday = d === todayLocal();
  jView = 'thread';
  jScrollToEnd = true;
  await render();
  await updateDraftNote();
}

// phase: checking | idle | offline | signin | error. "checking" until a sync attempt in this
// session has settled, so the pill never claims "synced" before the network has been tried.
const syncState = { phase: navigator.onLine ? 'checking' : 'offline', error: null };

async function renderStatus() {
  const queued = (await idb.countByIndex('captures', 'dirty', 1)) + (await idb.countByIndex('journal', 'state', 'pending'));
  const offline = !navigator.onLine || syncState.phase === 'offline';
  let cls, text;
  if (offline) {
    cls = 'offline'; text = queued ? `offline, ${queued} queued` : 'offline';
  } else if (syncState.phase === 'checking') {
    cls = 'offline'; text = queued ? `checking, ${queued} queued` : 'checking';
  } else if (syncState.phase === 'signin') {
    cls = 'signin'; text = queued ? `sign in, ${queued} queued` : 'sign in';
  } else if (queued) {
    cls = syncState.phase === 'error' ? 'error' : 'queued'; text = `queued ${queued}`;
  } else if (syncState.phase === 'error') {
    cls = 'error'; text = 'sync error';
  } else {
    cls = 'synced'; text = 'synced';
  }
  $('status-dot').className = 'dot ' + cls;
  $('status-text').textContent = text;
  $('s-sync').textContent = text;
  setRetry(queued > 0 || offline);

  const last = await meta.get('last_sync_ok');
  $('s-last').textContent = last ? `${fmtDate(last, deviceTz())} ${fmtTime(last, deviceTz())}` : 'never';
  const err = await meta.get('last_sync_error');
  $('s-error').textContent = err ? err.message : 'none';
}

// ---------- sync engine (SPEC.md 6.6) ----------

// 30 s retry: runs only while the app is visible and rows are queued or the pill reads
// offline; stops when hidden, or when synced with an empty queue. Covers reconnects that
// fire no online event (navigator.onLine never went false).
let retryTimer = null;
function setRetry(wanted) {
  const on = wanted && document.visibilityState === 'visible';
  if (on && !retryTimer) {
    retryTimer = setInterval(() => { if (document.visibilityState === 'visible') sync(); }, RETRY_MS);
  } else if (!on && retryTimer) {
    clearInterval(retryTimer);
    retryTimer = null;
  }
}

let syncing = false, syncAgain = false;

async function session() {
  if (!sb) return null;
  const { data, error } = await sb.auth.getSession();
  if (error) throw error;
  return data.session;
}

// navigator.onLine can stay true with no usable network (seen on the Pixel in airplane mode
// with a VPN active), so before syncing make one short request to the Supabase host.
// no-cors: an opaque response is enough to prove the host answered.
async function reachable() {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), PROBE_TIMEOUT_MS);
  try {
    await fetch(SUPABASE_URL + '/auth/v1/health', { mode: 'no-cors', cache: 'no-store', signal: ctl.signal });
    return true;
  } catch (e) {
    return false;
  } finally {
    clearTimeout(timer);
  }
}

function isNetworkError(e) {
  const s = (e && e.name || '') + ' ' + (e && e.message || '') + ' ' + (e && e.details || '');
  return /Failed to fetch|NetworkError|AbortError|aborted|Load failed|network/i.test(s);
}

function isAuthError(e) {
  const s = (e && (e.status || e.code || '')) + ' ' + (e && e.message || '');
  return /\b401\b|JWT|PGRST30[0-3]|not authenticated|42501/i.test(s);
}

async function push() {
  const dirty = await idb.byIndex('captures', 'dirty', 1);
  for (let i = 0; i < dirty.length; i += PUSH_BATCH) {
    const batch = dirty.slice(i, i + PUSH_BATCH).map(toServer);
    const { data, error } = await sb.rpc('tb_captures_upsert', { p: batch });
    if (error) throw error;
    if (!Array.isArray(data) || data.length !== batch.length) throw new Error('unexpected upsert response');
    const sent = new Map(batch.map((b) => [b.id, b.updated_at]));
    // Confirmed (applied or already as new on the server): clear dirty, unless the row
    // was edited locally while the request was in flight.
    await idb.merge('captures', data, (r) => r.id, (local, r) => {
      if (!local || local.updated_at !== sent.get(r.id)) return null;
      return Object.assign({}, local, { dirty: 0, server_ts: r.server_ts });
    });
  }
}

async function pull() {
  // pull_cursor is {server_ts, id}. server_ts stays the exact string the server returned:
  // turning it into a Date would drop the microseconds and replay the same page.
  let cursor = (await meta.get('pull_cursor')) || { server_ts: null, id: null };
  for (let page = 0; page < 1000; page++) {
    const { data, error } = await sb.rpc('tb_captures_since', {
      p_since_ts: cursor.server_ts, p_since_id: cursor.id
    });
    if (error) throw error;
    const rows = (data && data.rows) || [];
    if (rows.length === 0) break;
    await idb.merge('captures', rows, (r) => r.id, (local, r) => {
      if (!local) return Object.assign({}, r, { dirty: 0 });
      const incoming = Date.parse(r.updated_at), mine = Date.parse(local.updated_at);
      if (local.dirty && mine >= incoming) return null;      // local edit not yet pushed wins
      if (incoming >= mine) return Object.assign({}, r, { dirty: 0 });
      return null;
    });
    cursor = { server_ts: data.next_cursor.server_ts, id: data.next_cursor.id };
    await meta.set('pull_cursor', cursor);
  }
}

// ---------- journal sync (SPEC.md 8.3, 8.5) ----------

// Day title suffixes edited locally: push, then clear the flag unless edited again meanwhile.
async function pushSuffixes() {
  for (const d of (await idb.all('jdays')).filter((x) => x.suffix_dirty)) {
    const { error } = await sb.rpc('tb_journal_day_suffix', { p_local_date: d.local_date, p_suffix: d.suffix });
    if (error) throw error;
    await idb.update('jdays', d.local_date, (l) => l && l.suffix === d.suffix ? Object.assign({}, l, { suffix_dirty: 0 }) : null);
  }
}

// One turn to tb-journal. Resolves { ok, body } or { ok: false, message }; throws on a
// network failure or timeout (the turn stays pending) and on 401 (sign in).
async function callJournal(row, s) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), JOURNAL_TIMEOUT_MS);
  try {
    const res = await fetch(JOURNAL_URL, {
      method: 'POST', cache: 'no-store', signal: ctl.signal,
      headers: { Authorization: 'Bearer ' + s.access_token, apikey: SUPABASE_PUBLISHABLE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ local_date: row.local_date, message_id: row.id, content: row.content, created_at: row.created_at })
    });
    let body = null;
    try { body = await res.json(); } catch (e) { if (ctl.signal.aborted) throw e; }
    if (res.status === 401) {
      const e = new Error('tb-journal 401: ' + ((body && (body.message || body.msg)) || 'not authenticated'));
      e.status = 401;
      throw e;
    }
    if (res.ok && body && body.reply && body.user) return { ok: true, body };
    return { ok: false, message: (body && body.message) || `tb-journal returned HTTP ${res.status}` };
  } finally {
    clearTimeout(timer);
  }
}

// Queued turns, oldest first. A reply (new or already stored) marks the turn sent. A
// failure the server reports marks it "not sent" with the message and a Retry button, and
// stops this pass so later turns keep their order.
async function sendJournal(s) {
  const pending = (await idb.byIndex('journal', 'state', 'pending'))
    .sort((a, b) => (a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : a.id < b.id ? -1 : 1));
  for (const row of pending) {
    jInflight.add(row.id);
    if (tab === 'journal') render().catch(() => {});
    let r;
    try { r = await callJournal(row, s); } finally { jInflight.delete(row.id); }
    if (r.ok) {
      const { user, reply } = r.body;
      await idb.tx(['journal'], (t) => {
        const st = t.objectStore('journal');
        st.put(Object.assign({}, row, user, { state: 'sent', error: null }));
        st.put(Object.assign({}, reply, { state: 'sent', error: null }));
      });
      if (tab === 'journal' && jDay === row.local_date) jScrollToEnd = true;
    } else {
      await idb.update('journal', row.id, (x) => x && x.state === 'pending'
        ? Object.assign({}, x, { state: 'error', error: r.message }) : null);
      if (tab === 'journal' && jDay === row.local_date) jScrollToEnd = true;   // keep Retry in view
      if (tab === 'journal') await render().catch(() => {});
      break;
    }
    if (tab === 'journal') await render().catch(() => {});
  }
}

// Pull: list days, re-fetch only those whose message count or latest server_ts changed.
async function pullJournal() {
  const { data, error } = await sb.rpc('tb_journal_days', { p_limit: JOURNAL_DAYS_LIMIT });
  if (error) throw error;
  const local = new Map((await idb.all('jdays')).map((d) => [d.local_date, d]));
  for (const d of data || []) {
    const l = local.get(d.local_date);
    if (l && l.server_last_ts === d.last_server_ts && l.server_messages === d.messages) continue;
    const res = await sb.rpc('tb_journal_day', { p_local_date: d.local_date });
    if (res.error) throw res.error;
    const day = res.data;
    const replied = new Set(day.messages.filter((m) => m.role === 'assistant').map((m) => m.reply_to));
    await idb.merge('journal', day.messages, (m) => m.id, (mine, m) => {
      if (m.role === 'assistant' || replied.has(m.id)) return Object.assign({}, mine || {}, m, { state: 'sent', error: null });
      if (mine) return mine.server_ts === m.server_ts ? null : Object.assign({}, mine, { server_ts: m.server_ts });
      // A turn stored on the server with no reply, unknown here: show it with Retry.
      return Object.assign({}, m, { state: 'error', error: 'No reply was stored. Tap Retry.' });
    });
    await idb.update('jdays', d.local_date, (x) => {
      const base = x || { local_date: d.local_date, suffix: '', suffix_dirty: 0 };
      return Object.assign({}, base, {
        suffix: base.suffix_dirty ? base.suffix : day.suffix,
        server_last_ts: d.last_server_ts, server_messages: d.messages
      });
    });
  }
}

async function sync() {
  if (syncing) { syncAgain = true; return; }
  syncing = true;
  try {
    if (!navigator.onLine || !(await reachable())) {
      syncState.phase = 'offline';
      await meta.set('last_sync_error', { at: new Date().toISOString(), message: 'offline' });
      return;
    }
    let s = null;
    try { s = await session(); } catch (e) { /* treated as no session below */ }
    if (!s) {
      syncState.phase = 'signin';
      await meta.set('last_sync_error', { at: new Date().toISOString(), message: 'not signed in' });
      return;
    }
    await push();                 // captures first, so tb-journal sees the day's latest notes
    await pushSuffixes();
    await sendJournal(s);
    await pull();
    await pullJournal();
    syncState.phase = 'idle';
    await meta.set('last_sync_ok', new Date().toISOString());
    await meta.set('last_sync_error', null);
  } catch (e) {
    console.warn('sync failed', e);
    syncState.phase = !navigator.onLine || isNetworkError(e) ? 'offline' : isAuthError(e) ? 'signin' : 'error';
    const message = (e && e.message) || String(e);
    await meta.set('last_sync_error', { at: new Date().toISOString(), message }).catch(() => {});
  } finally {
    syncing = false;
    await render().catch(() => {});
    renderAuth();
    if (syncAgain) { syncAgain = false; sync(); }
  }
}

// ---------- storage persistence (SPEC.md 6.4) ----------

async function initPersistence() {
  if (!navigator.storage || !navigator.storage.persisted) {
    $('s-persist').textContent = 'not supported';
    return;
  }
  let persisted = await navigator.storage.persisted();
  if (!persisted) {
    // Asked on first run; asked again on later launches while still not granted, because
    // Chrome may grant it only once the app is installed. Chrome never prompts for this.
    persisted = await navigator.storage.persist();
    await meta.set('persist_result', { at: new Date().toISOString(), persisted });
  }
  $('s-persist').textContent = persisted ? 'persistent' : 'not persistent (may be evicted)';
}

// ---------- service worker: install in background, reload only on tap ----------

let updateRequested = false;
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then((reg) => {
    const offer = () => {
      if (reg.waiting && navigator.serviceWorker.controller) $('update-bar').hidden = false;
    };
    offer();
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (w) w.addEventListener('statechange', () => { if (w.state === 'installed') offer(); });
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') reg.update().catch(() => {});
    });
    $('update-bar').addEventListener('click', () => {
      if (!reg.waiting) return;
      updateRequested = true;
      reg.waiting.postMessage({ type: 'SKIP_WAITING' });
    });
  }).catch((e) => console.warn('service worker registration failed', e));
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (updateRequested) location.reload();   // first install's claim does not reload
  });
}

  const suffix = $('suffix-input').value.trim().slice(0, 200);
  await idb.update('jdays', day, (l) => Object.assign({ local_date: day, server_last_ts: null, server_messages: null },
    l || {}, { suffix, suffix_dirty: 1 }));
  await render();
  sync();
});
$('cap-close').addEventListener('click', () => { closeCapture('close').catch(fail('Close failed')); });
$('cap-save').addEventListener('click', () => { saveCapture(); });
$('cap-delete').addEventListener('click', () => { deleteCapture(); });
$('cap-body').addEventListener('input', () => { updateSaveEnabled(); writeDraft(); });
$('kind-note').addEventListener('click', () => { setKind('note'); writeDraft(); });
$('kind-journal').addEventListener('click', () => { setKind('journal'); writeDraft(); });
$('records').addEventListener('click', (ev) => {
  const row = ev.target.closest('.row');
  if (row && !cap.open) openEdit(row.dataset.id).catch(fail('Could not open capture'));
});
$('day-prev').addEventListener('click', () => {
  const d = $('day-prev').dataset.day;
  if (d) { viewDay = d; followToday = false; render(); }
});
$('day-next').addEventListener('click', () => {
  const d = $('day-next').dataset.day;
  if (d) { viewDay = d; followToday = false; render(); }
});
$('day-label').addEventListener('click', () => { followToday = true; render(); });
$('export').addEventListener('click', () => { exportCaptures().catch(fail('Export failed')); });
// "Today" rolls over at 0400 while the app sits open.
setInterval(() => {
  if (document.visibilityState !== 'visible') return;
  if (tab === 'captures' ? followToday && viewDay !== todayLocal() : jFollowToday && jDay !== todayLocal()) {
    render().then(updateDraftNote);
  }
}, 60000);
$('status').addEventListener('click', () => { renderAuth(); $('settings').showModal(); });
$('close').addEventListener('click', () => $('settings').close());
$('sync-now').addEventListener('click', () => sync());
window.addEventListener('online', () => { syncState.phase = 'checking'; renderStatus(); sync(); });
window.addEventListener('offline', () => { syncState.phase = 'offline'; renderStatus(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') sync();
  else setRetry(false);
});
if (sb) sb.auth.onAuthStateChange(() => { renderAuth(); });

(async function boot() {
  $('s-version').textContent = 'v' + APP_VERSION;
  await idb.open();
  if ((await meta.get('schema_version')) !== 2) await meta.set('schema_version', 2);
  // A reload while the capture screen was up leaves its history entry on top: pop it.
  popCaptureState();
  if (popWait) await popWait;
  // Entry route first, so a shortcut or share opens straight into capture.
  await handleEntry().catch((e) => console.error('entry route failed', e));
  await updateDraftNote();
  await render();
  renderAuth();
  initPersistence().catch(() => { $('s-persist').textContent = 'unknown'; });
  sync();
})().catch((e) => {
  console.error('boot failed', e);
  $('status-text').textContent = 'storage error';
  $('status-dot').className = 'dot error';
});
</script>
</body>
</html>
