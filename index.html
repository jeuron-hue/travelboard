<!doctype html>
<!--
  SOURCE OF RECORD: index.html, travelboard landing page (jeuron-hue/travelboard).

  What it does
  - Two entries: trip (phone app) and planner (rig app, built in M3).

  Change log (newest first)
  - 04/10/26 First version (M0). Planner shown as not built yet.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12161a">
<title>travelboard</title>
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('tb-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  @font-face {
    font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 400; font-display: swap;
    src: url('vendor/fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 600; font-display: swap;
    src: url('vendor/fonts/ibm-plex-sans-latin-600-normal.woff2') format('woff2');
  }
  :root, [data-theme="light"] {
    --ground: #f5f3ef; --surface: #ffffff; --ink: #1a1d21; --muted: #5f6b75; --line: #dcd8d0;
    --accent: #c2531b; --accent-bg: #fbe8dc;
  }
  [data-theme="dark"] {
    --ground: #12161a; --surface: #1b2127; --ink: #e8ecef; --muted: #93a0ab; --line: #2c343c;
    --accent: #e06a2b; --accent-bg: #3a2216;
  }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
    gap: 12px; padding: 24px 16px; box-sizing: border-box;
    font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 18px;
    background: var(--ground); color: var(--ink);
  }
  h1 { font-size: 24px; font-weight: 600; margin: 0 0 8px; }
  a, span.off {
    display: block; padding: 18px 16px; border-radius: 12px; text-decoration: none;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  a { border-color: var(--accent); background: var(--accent-bg); font-weight: 600; }
  span.off { color: var(--muted); }
</style>
</head>
<body>
  <h1>travelboard</h1>
  <a href="trip.html">trip: phone app</a>
  <span class="off">planner: rig app, from M3</span>
</body>
</html>
